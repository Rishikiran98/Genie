name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit + route tests (with coverage report)
        run: npm run test:coverage
      # Reporting only for now; drop continue-on-error once it has been green
      # across a few unrelated PRs (see evals/README.md).
      - name: Eval harness (judgement regressions)
        run: npm run eval
        continue-on-error: true
      - name: Build
        run: npm run build
